name: Scheduled X Post

on:
  schedule:
    # GitHub Actions の schedule はベストエフォートで遅延・ドロップする。
    # 各枠を「主＋予備2回」の計3回発火させ、1発落ちても後続が拾う冗長構成にする。
    # スクリプト側の冪等ガード（日×枠で1回だけ投稿）が二重投稿を防ぐ。
    # 発火間隔は 35〜40分（ジッター最大15分＋投稿処理を吸収できる安全マージン）。
    # --- 朝 JST 07:05/07:40/08:20 = UTC 22:05/22:40/23:20（前日扱い）---
    - cron: '5 22 * * *'
    - cron: '40 22 * * *'
    - cron: '20 23 * * *'
    # --- 昼 JST 12:05/12:40/13:20 = UTC 03:05/03:40/04:20 ---
    - cron: '5 3 * * *'
    - cron: '40 3 * * *'
    - cron: '20 4 * * *'
    # --- 夜 JST 19:05/19:40/20:20 = UTC 10:05/10:40/11:20 ---
    - cron: '5 10 * * *'
    - cron: '40 10 * * *'
    - cron: '20 11 * * *'

  # 手動トリガーも可能
  workflow_dispatch:

# 同一ワークフローの多重起動を直列化（冗長クロンが重なっても二重投稿しない保険）
concurrency:
  group: scheduled-x-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pending.md / posted.md をコミットするために必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 後で git push するために fetch-depth を 0 に
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tweepy

      - name: Run scheduled poster
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          TZ: Asia/Tokyo
          # 起動した cron からスロットを固定する（GitHub の発火時刻ズレ対策）。
          # 各枠3本の cron すべてを同じスロットへマップ。手動dispatchは空→時計判定にフォールバック。
          POST_SLOT: ${{ (github.event.schedule == '5 22 * * *' || github.event.schedule == '40 22 * * *' || github.event.schedule == '20 23 * * *') && '朝' || (github.event.schedule == '5 3 * * *' || github.event.schedule == '40 3 * * *' || github.event.schedule == '20 4 * * *') && '昼' || (github.event.schedule == '5 10 * * *' || github.event.schedule == '40 10 * * *' || github.event.schedule == '20 11 * * *') && '夜' || '' }}
        run: python scripts/scheduled_poster.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/stocks/pending.md storage/stocks/posted.md storage/analytics/scheduler.log storage/analytics/post-state.json
          if ! git diff --cached --quiet; then
            git commit -m "auto: post tweet at $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push
          else
            echo "No changes to commit (post might have been skipped for this slot)."
          fi
