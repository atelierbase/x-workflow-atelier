name: Scheduled X Image2 Post

# === image2生成済み画像の送信専用ワークフロー ===
# 画像生成は行わない。ChatGPT image2で作成し、repo にコミット済みの
# storage/images/{投稿ID}.png を pending.md から参照して投稿する。
# PCを閉じていても GitHub Actions が指定スロットで送信する。
on:
  # Schedule temporarily stopped on 2026-08-04 because automated runs are firing unexpectedly.
  # Keep workflow_dispatch so queued posts can still be sent manually if needed.
  workflow_dispatch:                  # 手動送信（緊急の取りこぼし救済など）
    inputs:
      slot:
        description: '送信する投稿枠'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - 朝
          - 昼
          - 夜

# 多重起動を直列化（保険）
concurrency:
  group: scheduled-x-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # schedule では pending.md に該当スロットの image2投稿が無ければ no-op。
    permissions:
      contents: write  # pending.md / posted.md をコミットするために必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tweepy

      - name: Resolve slot
        id: slot
        env:
          DISPATCH_SLOT: ${{ github.event.inputs.slot }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          slot="$DISPATCH_SLOT"
          if [ -z "$slot" ] || [ "$slot" = "auto" ]; then
            case "$EVENT_SCHEDULE" in
              "5 22 * * *") slot="朝" ;;
              "5 3 * * *") slot="昼" ;;
              "5 10 * * *") slot="夜" ;;
              *)
                hour="$(TZ=Asia/Tokyo date +%H)"
                if [ "$hour" -ge 6 ] && [ "$hour" -le 10 ]; then
                  slot="朝"
                elif [ "$hour" -ge 11 ] && [ "$hour" -le 14 ]; then
                  slot="昼"
                else
                  slot="夜"
                fi
                ;;
            esac
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - name: Send the queued post
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          TZ: Asia/Tokyo
          POST_SLOT: ${{ steps.slot.outputs.slot }}
          REQUIRE_IMAGE: "1"
          REQUIRE_PENDING: "1"
          SKIP_JITTER: "1"
        run: python scripts/scheduled_poster.py

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- storage/stocks/pending.md storage/stocks/posted.md storage/analytics/post-state.json; then
            echo "No post result changes (nothing was queued to send)."
          else
            git add storage/stocks/pending.md storage/stocks/posted.md storage/analytics/scheduler.log storage/analytics/post-state.json
            # [skip-send] を付けて、この結果コミットの push で自分自身を再起動しないようにする。
            git commit -m "auto: sent X post at $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST') [skip-send]"
            git push
          fi
