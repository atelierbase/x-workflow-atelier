name: Scheduled X Post

on:
  schedule:
    # GitHub Actions の cron は UTC 基準
    # JST 07:00 = UTC 22:00（前日扱い）
    # JST 12:00 = UTC 03:00
    # JST 19:00 = UTC 10:00
    - cron: '0 22 * * *'
    - cron: '0 3 * * *'
    - cron: '0 10 * * *'

  # 手動トリガーも可能
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pending.md / posted.md をコミットするために必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 後で git push するために fetch-depth を 0 に
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tweepy

      - name: Run scheduled poster
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          TZ: Asia/Tokyo
        run: python scripts/scheduled_poster.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/stocks/pending.md storage/stocks/posted.md storage/analytics/scheduler.log
          if ! git diff --cached --quiet; then
            git commit -m "auto: post tweet at $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push
          else
            echo "No changes to commit (post might have been skipped for this slot)."
          fi
