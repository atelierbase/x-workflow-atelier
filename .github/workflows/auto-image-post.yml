name: Auto X Image Post

on:
  schedule:
    # GitHub cron is UTC. These are JST 08:18 / 12:41 / 20:27.
    - cron: '18 23 * * *'
    - cron: '41 3 * * *'
    - cron: '27 11 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿枠'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - 朝
          - 昼
          - 夜
      force:
        description: '同日同枠の投稿済みガードを無視する'
        required: false
        default: false
        type: boolean

concurrency:
  group: auto-x-image-post
  cancel-in-progress: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests tweepy

      - name: Resolve slot
        id: slot
        env:
          DISPATCH_SLOT: ${{ github.event.inputs.slot }}
          DISPATCH_FORCE: ${{ github.event.inputs.force }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          slot="$DISPATCH_SLOT"
          if [ -z "$slot" ] || [ "$slot" = "auto" ]; then
            case "$EVENT_SCHEDULE" in
              "18 23 * * *") slot="朝" ;;
              "41 3 * * *") slot="昼" ;;
              "27 11 * * *") slot="夜" ;;
              *)
                hour="$(TZ=Asia/Tokyo date +%H)"
                if [ "$hour" -ge 6 ] && [ "$hour" -le 10 ]; then
                  slot="朝"
                elif [ "$hour" -ge 11 ] && [ "$hour" -le 14 ]; then
                  slot="昼"
                else
                  slot="夜"
                fi
                ;;
            esac
          fi
          force_arg=""
          if [ "$DISPATCH_FORCE" = "true" ]; then
            force_arg="--force"
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "force_arg=$force_arg" >> "$GITHUB_OUTPUT"

      - name: Generate image post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL || 'gpt-5-mini' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || '' }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'medium' }}
          POST_SLOT: ${{ steps.slot.outputs.slot }}
          TZ: Asia/Tokyo
        run: python scripts/generate_image_post.py --slot "${{ steps.slot.outputs.slot }}" ${{ steps.slot.outputs.force_arg }}

      - name: Commit queued image post
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/stocks/pending.md storage/images storage/analytics/routine.log
          if ! git diff --cached --quiet; then
            git commit -m "auto: queue X ${SLOT} image post at $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST') [skip-send]"
            git push
          else
            echo "No generated queue changes to commit."
          fi

      - name: Send queued post
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          POST_SLOT: ${{ steps.slot.outputs.slot }}
          REQUIRE_IMAGE: "1"
          SKIP_JITTER: "1"
          TZ: Asia/Tokyo
        run: python scripts/scheduled_poster.py

      - name: Commit post result
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/stocks/pending.md storage/stocks/posted.md storage/analytics/scheduler.log storage/analytics/post-state.json
          if ! git diff --cached --quiet; then
            git commit -m "auto: sent X ${SLOT} image post at $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST') [skip-send]"
            git push
          else
            echo "No post result changes to commit."
          fi
