name: Scheduled Threads Post

on:
  schedule:
    # GitHub Actions の cron は UTC 基準
    # JST 07:00 = UTC 22:00（前日扱い）
    # JST 12:00 = UTC 03:00
    # JST 19:00 = UTC 10:00
    - cron: '0 22 * * *'
    - cron: '0 3 * * *'
    - cron: '0 10 * * *'

  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run threads poster
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TZ: Asia/Tokyo
        run: python scripts/threads_poster.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/stocks/pending_threads.md storage/stocks/posted.md storage/analytics/scheduler_threads.log
          if ! git diff --cached --quiet; then
            git commit -m "auto: post threads at $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push
          else
            echo "No changes to commit (post might have been skipped for this slot)."
          fi
